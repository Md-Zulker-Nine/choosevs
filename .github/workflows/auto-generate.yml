name: Auto-Generate Content

on:
  schedule:
    # Blog posts: 3 runs/day at 2AM, 10AM, 6PM UTC
    - cron: '0 2,10,18 * * *'
    # Comparisons: 8 runs/day every 3 hours
    - cron: '0 */3 * * *'
  workflow_dispatch:
    inputs:
      posts:
        description: 'Number of blog posts to generate'
        required: false
        default: '1'
      comparisons:
        description: 'Number of comparisons to generate'
        required: false
        default: '1'
      generate_images:
        description: 'Generate images for content'
        required: false
        default: 'true'

jobs:
  generate-posts:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Generate Blog Posts (1 post per run, 3/day total)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MAX_WORDS: 1500
        run: npx tsx scripts/autoblog/generate-posts.ts --count=1 --min-words=1000
      - name: Commit and Push Blog Posts
        run: |
          git config user.name "ChooseVS Bot"
          git config user.email "bot@choosevs.com"
          mkdir -p public/images
          git add -A src/pages/blog/ public/images/ 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Auto: 1 blog post ($(date +%F))"
          git push

  generate-comparisons:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Generate Comparisons (1 per run, 8/day total)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npx tsx scripts/autogenerate/generate-comparisons.ts --count=1
      - name: Commit and Push Comparisons
        run: |
          git config user.name "ChooseVS Bot"
          git config user.email "bot@choosevs.com"
          mkdir -p public/images
          git add src/pages/compare/ public/images/ 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Auto: 1 comparison ($(date +%F))"
          git push
